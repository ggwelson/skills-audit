[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skills-audit"
dynamic = ["version"]
description = "Find every agent skill on your machine (Claude Code, Codex, Cursor and more), see what each costs and whether you use it, and get a prompt your agent can follow to remove the ones you pick."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabby Welson" }]
keywords = ["agent-skills", "claude-code", "codex", "cursor", "skills", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ggwelson/skills-audit"
Issues = "https://github.com/ggwelson/skills-audit/issues"

[project.scripts]
skills-audit = "skills_audit.cli:main"

[tool.hatch.version]
path = "src/skills_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_audit"]
